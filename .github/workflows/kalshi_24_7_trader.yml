name: Kalshi 24/7 Autonomous Cloud Trader

on:
  schedule:
    # Runs every 5 minutes, 24/7/365 on GitHub Cloud for $0.00
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows 1-click manual trigger from GitHub mobile/web

concurrency:
  group: kalshi-live-roller
  cancel-in-progress: true

jobs:
  trade-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Engine
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Ping Render Free Worker (Optional Keep-Alive)
        env:
          RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          if [ -n "$RENDER_HEALTH_URL" ]; then
            curl -s -m 5 "$RENDER_HEALTH_URL" || true
          fi

      - name: Execute Autonomous Trading Burst (If Cloud Secrets Enabled)
        env:
          KALSHI_ENV: prod
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: |
          if [ -z "$KALSHI_PRIVATE_KEY" ] && [ ! -f "secrets/kalshi_private_key.pem" ]; then
            echo "Local Mac Primary Engine is active (GitHub Cloud secret not set). Exiting cleanly."
            exit 0
          fi
          python scripts/live_auto_roller.py --duration 240 || true
