name: Kalshi 24/7 Autonomous Cloud Trader

on:
  # schedule:
  #   # PAUSED FOR ENGINEERING REMEDIATION & AUDIT
  #   - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force_cloud_burst_seconds:
        description: 'Optional: Force a cloud burst duration in seconds even if Mac was recently online'
        required: false
        default: '0'

concurrency:
  group: kalshi-live-roller
  cancel-in-progress: true

jobs:
  trade-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check if Local Mac Primary Engine is Awake (Zero-Downtime Cloud Failover)
        id: mac_check
        env:
          FORCE_BURST: ${{ github.event.inputs.force_cloud_burst_seconds }}
        run: |
          if [ -n "$FORCE_BURST" ] && [ "$FORCE_BURST" != "0" ]; then
            echo "🚀 Running Continuous Cloud Autonomous Loop (${FORCE_BURST}s)..."
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "burst_sec=$FORCE_BURST" >> $GITHUB_OUTPUT
            exit 0
          fi
          HB=$(curl -s -m 5 "https://ntfy.sh/kalshi-greg-hb-3fc522ce/json?poll=1&since=150s" || true)
          if echo "$HB" | grep -q "mac-online"; then
            echo "🟢 Local Mac Primary Engine is online and actively trading. Cloud Standby yielding cleanly."
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "burst_sec=0" >> $GITHUB_OUTPUT
          else
            echo "⚡ Local Mac is offline/shut down! Activating Continuous 28-Minute GitHub Cloud Autonomous Trading Engine!"
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "burst_sec=1680" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Engine
        if: steps.mac_check.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        if: steps.mac_check.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Fast Core Dependencies
        if: steps.mac_check.outputs.should_run == 'true'
        run: pip install -q httpx cryptography pydantic pydantic-settings python-dotenv numpy websockets

      - name: Execute 24/7 Cloud Autonomous Trading Burst
        if: steps.mac_check.outputs.should_run == 'true'
        env:
          KALSHI_ENV: PROD
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEXTBELT_API_KEY: ${{ secrets.TEXTBELT_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          BURST_SEC: ${{ steps.mac_check.outputs.burst_sec }}
        run: |
          python scripts/live_auto_roller.py --duration "$BURST_SEC" || true

      - name: Auto-Chain Next 28-Minute Cloud Loop If Mac Is Still Shut Down
        if: always() && steps.mac_check.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          HB=$(curl -s -m 5 "https://ntfy.sh/kalshi-greg-hb-3fc522ce/json?poll=1&since=150s" || true)
          if ! echo "$HB" | grep -q "mac-online"; then
            echo "🔄 Mac is still shut down — immediately chaining next 28-minute Cloud Trading Loop!"
            gh workflow run kalshi_24_7_trader.yml --repo gregmontoya/kalshi-bot || true
          fi
