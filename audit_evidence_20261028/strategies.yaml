# Hot-Reloadable Strategy Pod Configuration & Institutional Risk Rules

global:
  trading_mode: "PAPER"         # PAPER or LIVE
  environment: "DEMO"           # DEMO or PROD
  maker_first: true             # Post resting orders only ($0.00 fee)
  batch_contracts_minimum: 10   # Avoid whole-cent fee rounding on single contracts
  default_cancel_on_pause: true
  default_sell_position_floor: 0

risk:
  max_daily_drawdown_dollars: 500.00
  max_portfolio_exposure_pct: 0.35
  max_leg_exposure_dollars: 100.00
  sell_position_floor: 0
  cancel_on_pause: true

pod_1_maker_momentum_basket:
  enabled: true
  entry_zone: [0.68, 0.76]
  min_sharp_edge_dollars: 0.03
  dip_entry_offset_dollars: 0.02
  take_profit_zone: [0.88, 0.92]
  default_take_profit_dollars: 0.90
  guillotine_trigger_dollars: 0.48
  guillotine_hold_sharp_prob: 0.58
  guillotine_exit_sharp_prob: 0.50
  basket_size: 3
  default_contracts_per_leg: 10

pod_2_sharp_value_green_out:
  enabled: true
  entry_zone: [0.38, 0.58]
  min_sharp_edge_dollars: 0.05
  green_out_gain_dollars: 0.16
  default_contracts: 25

pod_3_tail_lock_harvester:
  enabled: true
  entry_zone: [0.95, 0.97]
  min_win_probability: 0.992
  max_seconds_remaining: 120
  opp_timeouts_allowed: 0
  default_contracts: 50

whale_tape_reader:
  enabled: true
  imbalance_ratio_threshold: 10.0   # 10:1 bid/ask dollar depth alert

weather_filter:
  wind_gust_threshold_mph: 15.0     # Auto-downgrade passing/scoring models
