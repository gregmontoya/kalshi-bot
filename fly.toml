app = "kalshi-quant-greg"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONUNBUFFERED = "1"
  PYTHONPATH = "/app"
  LIVE_MAKER_ENABLED = "true"
  LIVE_CASH_FLOOR_DOLLARS = "308.72"

[[mounts]]
  source = "recorder_data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
